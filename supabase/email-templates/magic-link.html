<!DOCTYPE html>
<html lang="zh-CN">
<body style="margin:0;background:#f4f4f5;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;">
        <tr>
            <td style="padding:32px 24px;background:#ffffff;border-radius:12px;">
                <div style="text-align:center;font-size:20px;font-weight:700;color:#18181b;">🥥 椰果工坊</div>
                <div style="margin-top:4px;text-align:center;font-size:12px;color:#71717a;">鸣潮拉表排轴 · 工程分享平台</div>
                <h2 style="margin:24px 0 8px;font-size:18px;color:#18181b;">登录验证</h2>
                <p style="margin:0;font-size:14px;line-height:1.7;color:#3f3f46;">
                    点击下方按钮即可登录椰果工坊，链接只对您的邮箱有效，且只能使用一次。
                </p>
                <div style="text-align:center;margin:28px 0;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 32px;background:#18181b;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:600;">登录椰果工坊</a>
                </div>
                <p style="margin:0;font-size:14px;line-height:1.7;color:#3f3f46;">
                    如果按钮无法点击，请使用下方验证码登录：
                </p>
                <div style="margin:12px 0;text-align:center;">
                    <span style="display:inline-block;padding:12px 24px;background:#f4f4f5;border:1px solid #e4e4e7;border-radius:8px;font-size:24px;font-weight:700;letter-spacing:4px;color:#18181b;">{{ .Token }}</span>
                </div>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#71717a;">
                    出于安全考虑，该链接和验证码将在短时间内过期。如果您没有请求登录，请忽略此邮件。
                </p>
                <hr style="border:none;border-top:1px solid #e4e4e7;margin:24px 0 16px;">
                <p style="margin:0;text-align:center;font-size:12px;color:#a1a1aa;">椰果工坊 · 社区公益工具</p>
            </td>
        </tr>
    </table>
</body>
</html>
